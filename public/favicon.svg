<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#6C3FD4"/>
  <!-- Letter O stylized as a circuit/core ring -->
  <circle cx="32" cy="32" r="16" stroke="white" stroke-width="5" fill="none"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="white"/>
  <!-- Four connector lines (circuit style) -->
  <line x1="32" y1="12" x2="32" y2="8"  stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="56" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="8"  y2="32" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="56" y2="32" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
